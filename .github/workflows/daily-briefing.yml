name: Daily AI Briefing

on:
  schedule:
    # UTC 22:00 = 北京时间次日 06:00，每天自动跑一次
    # UTC 00:10 = 北京时间 08:10，等免费模型额度（UTC 0 点重置）刷新后再跑
    - cron: '10 0 * * *'
  workflow_dispatch: # 支持手动触发一次

permissions:
  contents: write # 用仓库内置 GITHUB_TOKEN 提交日报，无需额外令牌

concurrency:
  group: daily-ai-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate briefing
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/generate-briefing.mjs

      - name: Commit and push
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data/dailyBriefing.json data/dailyBriefingArchive.json
          if git diff --cached --quiet; then
            echo "今日日报无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(briefing): 自动更新 AI 日报 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push
